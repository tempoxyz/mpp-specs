name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: tempoxyz/gh-actions/vendor/docker/setup-buildx-action@6f436eb3a168279692739e8c0c9fdb52b94bfae7

      - uses: tempoxyz/gh-actions/vendor/docker/build-push-action@6f436eb3a168279692739e8c0c9fdb52b94bfae7
        with:
          context: .
          load: true
          tags: ietf-spec-tools:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifacts
        run: |
          mkdir -p .cache
          docker run --rm --user $(id -u):$(id -g) -e HOME=/data -v ${{ github.workspace }}:/data ietf-spec-tools:latest /data/scripts/gen.sh

      - name: Upload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ietf-specs-${{ github.sha }}
          path: artifacts/
          retention-days: 90

      - name: Publish spec artifacts as GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          RELEASE_TAG: spec-artifacts-${{ github.sha }}
        run: |
          if release_is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [[ "$release_is_draft" == "false" ]]; then
              echo "Release $RELEASE_TAG is already published"
              exit 0
            fi

            gh release delete "$RELEASE_TAG" --yes --cleanup-tag
          fi

          gh release create "$RELEASE_TAG" artifacts/*.html artifacts/*.txt artifacts/*.xml artifacts/*.pdf \
            --target "$COMMIT_SHA" \
            --title "Latest spec artifacts" \
            --notes "Auto-published spec build artifacts from commit $COMMIT_SHA.

          Contains HTML, TXT, XML, and PDF renderings of all IETF Payment Auth specifications." \
            --latest

      - name: Generate index page
        run: |
          docker run --rm --user $(id -u):$(id -g) -e HOME=/data -v ${{ github.workspace }}:/data ietf-spec-tools:latest python3 /data/scripts/gen_index.py

      - name: Generate problem pages
        run: |
          docker run --rm --user $(id -u):$(id -g) -e HOME=/data -v ${{ github.workspace }}:/data ietf-spec-tools:latest python3 /data/scripts/gen_problems.py

      - name: Prepare GitHub Pages
        run: |
          mkdir -p _site
          cp pages/index.html _site/
          cp -r pages/problems _site/problems
          cp artifacts/*.html artifacts/*.txt artifacts/*.xml artifacts/*.pdf _site/
          echo "paymentauth.org" > _site/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
