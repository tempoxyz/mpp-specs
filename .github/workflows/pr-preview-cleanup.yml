name: Cleanup PR Spec Preview

on:
  # This job never checks out or executes pull request code; it only removes derived release assets.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup:
    name: Delete preview release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@baf48ebcfcb26812085b8351125493b2ef8009ab # 2026-09-21T19-33-30Z-baf48ebc

      - name: Delete preview release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: pr-${{ github.event.pull_request.number }}-spec-preview
        run: |
          # This workflow intentionally avoids checking out or executing PR code.
          # It only deletes the derived preview release for the closed PR.
          gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag || true
