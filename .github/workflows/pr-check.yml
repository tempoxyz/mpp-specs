name: Check Specs

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-${{ github.event.number || github.run_id }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  ci-gate:
    name: CI Gate
    if: always()
    needs: [build-and-check]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs failed or were cancelled"
            exit 1
          fi

  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: tempoxyz/gh-actions/vendor/docker/setup-buildx-action@6f436eb3a168279692739e8c0c9fdb52b94bfae7

      - uses: tempoxyz/gh-actions/vendor/docker/build-push-action@6f436eb3a168279692739e8c0c9fdb52b94bfae7
        with:
          context: .
          load: true
          tags: ietf-spec-tools:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Lint frontmatter
        run: |
          docker run --rm -v "$(pwd)":/data ietf-spec-tools:latest python3 /data/scripts/lint_frontmatter.py

      - name: Lint external section references
        run: |
          docker run --rm -v "$(pwd)":/data ietf-spec-tools:latest python3 /data/scripts/lint_external_section_refs.py

      - name: Build and validate specs
        run: |
          mkdir -p .cache
          docker run --rm --user $(id -u):$(id -g) -e HOME=/data -v ${{ github.workspace }}:/data ietf-spec-tools:latest /data/scripts/check.sh

      # deploy.yml uploads the published specs as an ietf-specs-<sha> artifact on each
      # successful run on main. Resolve the newest such run, then fetch with the
      # GitHub-authored action; each artifact is extracted into its own directory.
      - name: Find latest main deploy run
        if: github.event_name == 'pull_request'
        id: main-deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow deploy.yml --branch main --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [[ -z "$run_id" ]]; then
            echo "::warning::No successful deploy.yml run on main; every spec will be reported as new"
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download main branch artifacts
        if: github.event_name == 'pull_request' && steps.main-deploy.outputs.run-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ steps.main-deploy.outputs.run-id }}
          github-token: ${{ github.token }}
          pattern: ietf-specs-*
          path: /tmp/main-artifacts
        continue-on-error: true

      - name: Generate diffs against main
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p artifacts/diffs
          MAIN_DIR=$(find /tmp/main-artifacts -maxdepth 1 -type d -name "ietf-specs-*" 2>/dev/null | head -1)
          if [[ -z "$MAIN_DIR" ]]; then
            MAIN_DIR="/tmp/main-artifacts"
          fi
          for file in artifacts/draft-*.txt; do
            name=$(basename "$file" .txt)
            if [[ -f "$MAIN_DIR/${name}.txt" ]]; then
              diff -u "$MAIN_DIR/${name}.txt" "$file" > "artifacts/diffs/${name}-diff.txt" || true
            else
              echo "New spec (no base on main to compare)" > "artifacts/diffs/${name}-diff.txt"
            fi
          done

      - name: Upload spec artifacts
        id: upload-specs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.event.number && format('pr-{0}-specs', github.event.number) || format('manual-{0}-specs', github.run_id) }}
          path: |
            artifacts/draft-*.html
            artifacts/draft-*.txt
            artifacts/draft-*.xml
            artifacts/draft-*.pdf
          retention-days: 30

      - name: Upload diff artifacts
        id: upload-diffs
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ format('pr-{0}-diffs', github.event.number) }}
          path: artifacts/diffs/
          retention-days: 30

      - name: Save PR number
        if: github.event_name == 'pull_request'
        run: echo "${{ github.event.number }}" > artifacts/pr-number.txt

      - name: Upload PR metadata
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-metadata
          path: artifacts/pr-number.txt
          retention-days: 5
