name = "IntentSubscription"
version = "0.1.0"
defaultTargets = ["IntentSubscription"]

# Every warning is a build error: a sorry, a deprecated name, an unused variable or simp
# argument fails 'lake build' itself, not only the axiom audit.
[leanOptions]
warningAsError = true

[[lean_lib]]
name = "IntentSubscription"
# Build every module under IntentSubscription/, even one nothing imports, so no proof goes unchecked.
globs = ["IntentSubscription", "IntentSubscription.+"]
