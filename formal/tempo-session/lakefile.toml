name = "TempoSession"
version = "0.1.0"
defaultTargets = ["TempoSession"]

# Every warning is a build error: a sorry, a deprecated name, an unused variable or simp
# argument fails 'lake build' itself, not only the axiom audit.
# The shared definitions in ../core (run, Reachable, upd), audited with this model.
[[require]]
name = "MppCore"
path = "../core"

[leanOptions]
warningAsError = true

[[lean_lib]]
name = "TempoSession"
# Build every module under TempoSession/, even one nothing imports, so no proof goes unchecked.
globs = ["TempoSession", "TempoSession.+"]
