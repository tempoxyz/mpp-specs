name = "TempoCharge"
version = "0.1.0"
defaultTargets = ["TempoCharge"]

# Every warning is a build error: a sorry, a deprecated name, an unused variable or simp
# argument fails 'lake build' itself, not only the axiom audit.
[leanOptions]
warningAsError = true

[[lean_lib]]
name = "TempoCharge"
# Build every module under TempoCharge/, even one nothing imports, so no proof goes unchecked.
globs = ["TempoCharge", "TempoCharge.+"]
